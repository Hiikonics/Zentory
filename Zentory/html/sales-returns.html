<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zentory - Sales Returns</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h3>Zentory</h3>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="inventory.html" class="nav-item">Inventory</a>
                <a href="procurement.html" class="nav-item">Procurement</a>
                <a href="pos.html" class="nav-item">POS</a>
                <a href="sales-returns.html" class="nav-item active">Sales Returns</a>
                <a href="audit-logs.html" class="nav-item">Audit Logs</a>
            </nav>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>Sales Returns</h1>
                <p>Kelola pengembalian produk dari pelanggan</p>
            </div>

            <div class="controls">
                <input type="text" class="search-box" placeholder="Cari return...">
                <button class="btn">Filter</button>
                <button class="btn btn-primary">+ New Return</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Return ID</th>
                            <th>Receipt ID</th>
                            <th>Customer</th>
                            <th>Product</th>
                            <th>Qty</th>
                            <th>Reason</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="returnsTable">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const returnsData = [
            { returnId: "RET-2024-101", receiptId: "RCP-2024-4521", customer: "Ahmad Wijaya", product: "Orange Juice 1L", qty: 2, reason: "Expired", amount: "Rp 24.000", status: "pending" },
            { returnId: "RET-2024-102", receiptId: "RCP-2024-4522", customer: "Siti Nurhaliza", product: "Potato Chips 50g", qty: 5, reason: "Defective", amount: "Rp 40.000", status: "approved" },
            { returnId: "RET-2024-103", receiptId: "RCP-2024-4520", customer: "Budi Santoso", product: "Soap Bar 100g", qty: 1, reason: "Changed mind", amount: "Rp 10.000", status: "rejected" },
            { returnId: "RET-2024-104", receiptId: "RCP-2024-4519", customer: "Dewi Lestari", product: "Shampoo 250ml", qty: 1, reason: "Damaged packaging", amount: "Rp 30.000", status: "processed" },
            { returnId: "RET-2024-105", receiptId: "RCP-2024-4518", customer: "Rudi Hartono", product: "Cookies 200g", qty: 3, reason: "Broken", amount: "Rp 18.000", status: "pending" },
        ];

        function getStatusBadge(status) {
            const statusMap = {
                'pending': { class: 'badge-pending', text: 'Pending' },
                'approved': { class: 'badge-approved', text: 'Approved' },
                'rejected': { class: 'badge-rejected', text: 'Rejected' },
                'processed': { class: 'badge-processed', text: 'Processed' }
            };
            const info = statusMap[status] || statusMap['pending'];
            return `<span class="badge ${info.class}">${info.text}</span>`;
        }

        function renderReturns() {
            const table = document.getElementById('returnsTable');
            table.innerHTML = returnsData.map(item => `
                <tr>
                    <td>${item.returnId}</td>
                    <td>${item.receiptId}</td>
                    <td>${item.customer}</td>
                    <td>${item.product}</td>
                    <td>${item.qty}</td>
                    <td>${item.reason}</td>
                    <td>${item.amount}</td>
                    <td>${getStatusBadge(item.status)}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-small">View</button>
                            <button class="btn btn-small">Process</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', renderReturns);
    </script>
</body>
</html>
